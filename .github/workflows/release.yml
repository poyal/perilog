name: Publish signed Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the release tag
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Verify packaged release assets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${GITHUB_REF_NAME#v}"
          test -s "readme/releases/$GITHUB_REF_NAME.md"
          test -s ".release/perilog-$version.apk"
          test -s ".release/perilog-$version-screenshots.zip"
          cd .release
          sha256sum --strict -c "perilog-$version.sha256"
      - name: Upload assets and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            ".release/perilog-$version.apk" \
            ".release/perilog-$version.sha256" \
            ".release/perilog-$version-screenshots.zip" \
            --verify-tag --draft \
            --title "나의 하루, 나의 투석 기록 $GITHUB_REF_NAME" \
            --notes-file "readme/releases/$GITHUB_REF_NAME.md"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
