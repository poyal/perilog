name: Android checks and E2E

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'readme/**'
      - 'design/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_USER_HOME: /tmp/perilog-android
      ANDROID_EMULATOR_HOME: /tmp/perilog-android
      ANDROID_AVD_HOME: /tmp/perilog-android/avd
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools emulator'
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform and emulator image
        timeout-minutes: 8
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "system-images;android-35;google_apis;x86_64"
      - name: Create Android emulator
        timeout-minutes: 2
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --name perilog-e2e --path "$ANDROID_AVD_HOME/perilog-e2e.avd" --package "system-images;android-35;google_apis;x86_64" --device pixel_7 --force
          test -s "$ANDROID_AVD_HOME/perilog-e2e.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx perilog-e2e
      - name: Boot Android emulator
        timeout-minutes: 4
        run: |
          "$ANDROID_HOME/emulator/emulator" -avd perilog-e2e -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > /tmp/perilog-emulator.log 2>&1 &
          perilog_emulator_pid=$!
          perilog_boot_deadline=$((SECONDS + 180))
          while (( SECONDS < perilog_boot_deadline )); do
            if ! kill -0 "$perilog_emulator_pid" 2>/dev/null; then
              echo '::error::Android emulator exited before boot completed.'
              tail -n 80 /tmp/perilog-emulator.log
              exit 1
            fi
            if timeout 5 adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -qx 1; then
              adb -s emulator-5554 shell input keyevent 82
              exit 0
            fi
            sleep 2
          done
          echo '::error::Android emulator did not boot within 180 seconds.'
          tail -n 80 /tmp/perilog-emulator.log
          exit 1
      - name: Show emulator startup failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          log = Path('/tmp/perilog-emulator.log')
          if log.exists():
              message = '\n'.join(log.read_text(errors='replace').splitlines()[-30:])
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Android emulator startup log::' + message)
          PY
      - name: Unit tests and lint
        run: ./scripts/build.sh :app:testDebugUnitTest :app:lintDebug
      - name: Offline E2E with normal and large text
        run: ./scripts/test-e2e.sh all
      - name: Recover an unsaved form after process death
        run: ./scripts/test-process-restore.py
      - name: Upload test reports and failure captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perilog-test-results
          include-hidden-files: true
          retention-days: 14
          path: |
            .tools/e2e-results/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            /tmp/perilog-emulator.log
